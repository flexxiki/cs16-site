<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Яндекс</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0b0c10;
    color:#fff;
    min-height:100vh;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 30px;
}

.left-top{
    display:flex;
    gap:12px;
    align-items:center;
}

.logo-mini{
    display:flex;
    align-items:center;
    cursor:pointer;
}

.logo-mini img{
    width:28px;
    height:28px;
}

.right-top{
    display:flex;
    gap:12px;
    align-items:center;
}

.pill{
    background:#23252b;
    border-radius:30px;
    padding:12px 18px;
    color:#d4d4d4;
    font-size:14px;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:url("https://i.imgur.com/5cLDehB.jpeg") center/cover;
}

.main{
    max-width:1100px;
    margin:auto;
    text-align:center;
    padding-top:70px;
}

.hero{
    font-size:42px;
    font-weight:700;
    margin-bottom:60px;
}

.services{
    display:flex;
    justify-content:center;
    gap:40px;
    flex-wrap:wrap;
    margin-bottom:60px;
}

.service{
    cursor:pointer;
    transition:.2s;
}

.service:hover{
    transform:translateY(-5px);
}

.service img{
    width:90px;
    height:90px;
    border-radius:20px;
    display:block;
    margin:auto;
    object-fit:cover;
}

.service span{
    display:block;
    margin-top:10px;
    font-size:15px;
}

.search-box{
    width:100%;
    max-width:1000px;
    margin:auto;
    background:#383a40;
    border-radius:40px;
    height:72px;
    display:flex;
    align-items:center;
    padding:0 20px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:50%;
    background:#ff6243;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    font-weight:bold;
    color:white;
}

.search-input{
    flex:1;
    border:none;
    background:transparent;
    color:white;
    font-size:24px;
    text-align:center;
    outline:none;
}

.icons{
    display:flex;
    gap:15px;
    color:#bbb;
    font-size:24px;
}

.banner{
    margin-top:40px;
    background:#121317;
    border:1px solid #2d3038;
    border-radius:25px;
    overflow:hidden;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.banner-left{
    padding:30px;
    text-align:left;
}

.banner-left h2{
    font-size:52px;
}

.banner-left p{
    color:#999;
    margin-top:10px;
}

.banner-right{
    width:240px;
    height:140px;
    background:linear-gradient(135deg,#ffd4b5,#ffb7ff);
}

@media(max-width:768px){
    .hero{font-size:28px;}
    .banner{flex-direction:column;}
    .banner-right{width:100%;}
    .search-input{font-size:18px;}
}
</style>
</head>
